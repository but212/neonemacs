[package]
name = "neonemacs-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
memchr = { version = "2", default-features = false }
neobit = "1.1.0"
triomphe = { version = "0.1", default-features = false }
unicode-width = { version = "0.2", features = ["no_std"] }
weave-tree = { path = "../weave-tree" }

[dev-dependencies]
criterion = "0.5"
proptest = "1"
syn = { version = "2", features = ["full", "visit"] }

[[bench]]
name = "editor_perf_bench"
harness = false
