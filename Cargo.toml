[package]
name = "neonemacs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[dependencies]
crossterm = "0.29"
memchr = "2"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
unicode-width = "0.2"

[features]
# Exposes `test_support` to integration tests. Off by default, so release builds do not carry it.
test-support = []

[dev-dependencies]
neonemacs = { path = ".", features = ["test-support"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
incremental = true
panic = "abort"
debug = "full"
split-debuginfo = "packed"
strip = "symbols"
