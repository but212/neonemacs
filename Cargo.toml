[workspace]
members = ["crates/neonemacs-core"]
default-members = [".", "crates/neonemacs-core"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[package]
name = "neonemacs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crossterm = "0.29"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
neonemacs-core = { path = "crates/neonemacs-core" }
sha2 = "0.10"

[features]
# Exposes `test_support` to integration tests. Off by default, so release builds do not carry it.
test-support = []

[dev-dependencies]
neonemacs = { path = ".", features = ["test-support"] }
portable-pty = "0.9.0"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
incremental = true
panic = "abort"
debug = "full"
split-debuginfo = "packed"
strip = "symbols"
