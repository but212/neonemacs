[workspace]
members = ["crates/neonemacs-core", "crates/weave-tree"]
default-members = [".", "crates/neonemacs-core", "crates/weave-tree"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[package]
name = "neonemacs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crossterm = "0.29"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
neonemacs-core = { path = "crates/neonemacs-core" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }

[features]
# Exposes `test_support` to integration tests. Off by default, so release builds do not carry it.
test-support = []

[dev-dependencies]
criterion = "0.5"
neonemacs = { path = ".", features = ["test-support"] }
portable-pty = "0.9.0"
tempfile = "3"

[[bench]]
name = "render_perf_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
debug = "full"
split-debuginfo = "packed"
strip = "symbols"
